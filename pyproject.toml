[project]
name = "veltrix-peopleops"
version = "0.1.0"
description = "Veltrix PeopleOps Assistant: HR question answering and leave management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pymupdf<2",
    "python-docx>=1.2.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
